<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E3A2B">
<title>Pawcation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E3A2B;
    --ink-soft:#4A5F4F;
    --canvas:#F1EFE2;
    --paper:#FFFFFF;
    --line:#DAD5BF;
    --gold:#E3A23B;
    --gold-deep:#C67F1E;
    --moss:#6E8F72;
    --moss-deep:#4F7256;
    --stamp:#C1442E;
    --shadow: 0 18px 40px -18px rgba(30,58,43,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background:var(--canvas);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  /* ---------- app shell (fills the real page width) ---------- */
  .screen-wrap{
    width:100%;
    height:100dvh;
    background:var(--canvas);
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* content that should stay a comfortable reading/form width even on a wide browser */
  .narrow{ max-width:640px; margin:0 auto; width:100%; }

  /* card lists: single column on phones, multi-column grid once there's room */
  .card-grid{ display:block; }
  @media (min-width:760px){
    .card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px; align-items:start; }
    .card-grid .card{ margin-bottom:0; }
  }

  /* ---------- top bar / mode switch ---------- */
  .topbar{
    padding:calc(env(safe-area-inset-top, 0px) + 16px) 20px 14px;
    flex-shrink:0;
  }
  .topbar-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:12px;
  }
  .brand{
    display:flex; align-items:center; gap:8px;
    font-family:'Fraunces',serif; font-weight:700; font-size:19px;
  }
  .brand .mark{
    width:30px;height:30px;border-radius:9px;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
  }
  .backbtn{
    width:34px;height:34px;border-radius:50%;
    background:var(--paper);
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);
    cursor:pointer;
    flex-shrink:0;
  }
  .modeswitch{
    display:flex;
    background:rgba(30,58,43,0.08);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .modeswitch button{
    border:none; background:transparent;
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
    padding:8px 8px; border-radius:999px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:.2s;
    flex:1;
    text-align:center;
    white-space:nowrap;
  }
  .modeswitch button.active{
    background:var(--ink); color:var(--canvas);
  }

  /* ---------- content area ---------- */
  .content{
    flex:1;
    overflow-y:auto;
    padding:0 20px 100px;
  }
  @media (min-width:900px){
    .content{ padding:0 40px 100px; }
    .topbar{ padding-left:40px; padding-right:40px; }
  }
  .content::-webkit-scrollbar{display:none;}
  h2.title{
    font-family:'Fraunces',serif; font-weight:600; font-size:24px;
    margin:2px 0 4px;
  }
  .subtitle{
    font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5;
  }

  /* ---------- search ---------- */
  .searchbar{
    display:flex; align-items:center; gap:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 14px;
    margin-bottom:16px;
  }
  .searchbar input{
    border:none; outline:none; background:transparent;
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);
    width:100%;
  }
  .searchbar input::placeholder{color:#9CA694;}

  .chiprow{display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; padding-bottom:2px;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0;
    font-size:12.5px; font-weight:600;
    padding:8px 14px; border-radius:999px;
    background:var(--paper); border:1px solid var(--line);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{ background:var(--moss); border-color:var(--moss); color:#fff; }

  /* ---------- sitter / pet cards ---------- */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:14px;
    margin-bottom:14px;
    display:flex; gap:12px;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .card:active{ transform:scale(0.98); }
  .thumb{
    width:78px;height:78px;border-radius:14px;flex-shrink:0;
    background-size:cover; background-position:center;
    display:flex; align-items:flex-end; justify-content:flex-end;
    position:relative;
  }
  .heart-btn{
    position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%;
    background:rgba(255,255,255,0.9); display:flex; align-items:center; justify-content:center;
    color:var(--stamp); cursor:pointer; z-index:2;
  }
  .heart-btn svg{ width:13px; height:13px; }
  .heart-btn.active svg{ fill:var(--stamp); }
  .hero-img .heart-btn{ top:16px; right:16px; width:38px; height:38px; }
  .hero-img .heart-btn svg{ width:18px; height:18px; }
  .card-body{flex:1; min-width:0;}
  .card-toprow{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
  .card-name{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .rating{
    display:flex; align-items:center; gap:3px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
    color:var(--gold-deep); flex-shrink:0;
  }
  .card-loc{font-size:12.5px; color:var(--ink-soft); margin:2px 0 6px; display:flex; align-items:center; gap:4px;}
  .tagrow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .tag{
    font-size:11px; font-weight:600; color:var(--moss-deep);
    background:rgba(110,143,114,0.14);
    padding:3px 8px; border-radius:8px;
  }
  .price{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px;}
  .price span{color:var(--ink-soft); font-weight:400; font-size:11.5px;}

  /* ---------- section label ---------- */
  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); margin:22px 0 10px;
  }

  /* ---------- onboarding ---------- */
  .onboard{
    height:100%; max-width:460px; margin:0 auto; display:flex; flex-direction:column; justify-content:center;
    padding:0 22px 60px; text-align:center; position:relative;
  }
  .onboard .mark-lg{
    width:64px;height:64px;border-radius:20px; background:var(--ink); color:var(--gold);
    display:flex;align-items:center;justify-content:center; margin:0 auto 18px;
  }
  .onboard h1{
    font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin:0 0 8px; line-height:1.15;
  }
  .onboard p.tag{
    font-size:14px; color:var(--ink-soft); line-height:1.5; margin:0 0 34px;
    background:transparent; padding:0;
  }
  .roleoption{
    display:flex; align-items:center; gap:14px; text-align:left;
    background:var(--paper); border:1.5px solid var(--line); border-radius:20px;
    padding:16px; margin-bottom:14px; cursor:pointer;
  }
  .roleoption .ricon{
    width:48px;height:48px;border-radius:14px; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .roleoption.owner .ricon{ background:rgba(227,162,59,0.18); color:var(--gold-deep); }
  .roleoption.sitter .ricon{ background:rgba(110,143,114,0.18); color:var(--moss-deep); }
  .roleoption.trainer .ricon{ background:rgba(193,68,46,0.15); color:var(--stamp); }
  .roleoption strong{font-family:'Fraunces',serif; font-size:15.5px; font-weight:600; display:block;}
  .roleoption span{font-size:12.5px; color:var(--ink-soft);}

  /* ---------- language switch ---------- */
  .langswitch{
    position:absolute; top:18px; right:18px; display:flex; gap:2px;
    background:var(--paper); border:1.5px solid var(--line); border-radius:12px; padding:3px;
  }
  .onboard .langswitch{ position:absolute; }
  .langpill{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    padding:5px 10px; border-radius:9px; cursor:pointer; color:var(--ink-soft);
  }
  .langpill.active{ background:var(--ink); color:var(--canvas); }

  /* ---------- onboarding tour ---------- */
  .tourscreen{ position:relative; }
  .tourskip{
    position:absolute; top:20px; left:0; right:0; text-align:center;
    font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .tourdots{ display:flex; gap:7px; justify-content:center; margin-bottom:26px; }
  .tourdot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .tourdot.active{ background:var(--ink); width:20px; border-radius:5px; transition:all .2s; }
  .tourbtn{ margin-top:4px; }


  /* ---------- search tools, filters, map ---------- */
  .searchbar .clearq{ font-size:20px; line-height:1; color:var(--ink-soft); cursor:pointer; padding:0 4px; }
  .searchtools{ display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .toolbtn{
    display:flex; align-items:center; gap:6px; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    background:var(--paper); border:1px solid var(--line); color:var(--ink-soft);
    padding:8px 12px; border-radius:999px; cursor:pointer;
  }
  .toolbtn.active{ background:var(--ink); border-color:var(--ink); color:var(--canvas); }
  .toolbtn .tbadge{
    font-style:normal; font-size:10.5px; background:var(--gold); color:var(--ink);
    min-width:17px; height:17px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px;
  }
  .viewtoggle{ margin-left:auto; display:flex; background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:3px; }
  .viewtoggle span{ font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; color:var(--ink-soft); cursor:pointer; }
  .viewtoggle span.active{ background:var(--moss); color:#fff; }
  .filterpanel{
    background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:14px 14px 12px; margin-bottom:14px;
  }
  .fp-sec{ margin-bottom:14px; }
  .fp-label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:8px; }
  .fp-label b{ color:var(--ink); }
  .filterpanel input[type=range]{ width:100%; accent-color:var(--moss-deep); }
  .chiprow.wrap{ flex-wrap:wrap; overflow:visible; margin-bottom:0; }
  .chip svg{ width:12px; height:12px; vertical-align:-1px; }
  .fp-select{
    width:100%; font-family:'Inter',sans-serif; font-size:13.5px; padding:11px 12px; border-radius:12px;
    border:1px solid var(--line); background:var(--canvas); color:var(--ink);
  }
  .fp-clear{ padding:10px; font-size:13px; }
  .resultsmeta{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:12.5px; color:var(--ink-soft); margin:0 0 12px;
  }
  .resultsmeta b{ color:var(--ink); }
  .resultsmeta span{ display:inline-flex; align-items:center; gap:5px; }
  .mapwrap{
    position:relative; border-radius:20px; overflow:hidden; border:1px solid var(--line);
    background:#EAE6D0; aspect-ratio: 302 / 360; max-height:68vh; width:100%; margin:0 auto 12px; touch-action:none;
  }
  .mapsvg{ width:100%; height:100%; display:block; cursor:grab; user-select:none; }
  .mapsvg:active{ cursor:grabbing; }
  .mappin{ cursor:pointer; }
  .mapctl{ position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:6px; }
  .mapctl button{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--paper);
    font-size:18px; font-weight:600; color:var(--ink); cursor:pointer; box-shadow:0 4px 10px -6px rgba(30,58,43,.4);
  }
  .maplegend{
    position:absolute; left:10px; bottom:10px; background:rgba(255,255,255,.92); border-radius:999px;
    font-size:11px; font-weight:600; color:var(--ink-soft); padding:5px 10px 5px 8px; display:flex; align-items:center; gap:6px;
  }
  .maplegend i{ width:9px; height:9px; border-radius:50%; background:#2C5CE0; display:inline-block; }
  .mapempty{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,.95);
    padding:10px 16px; border-radius:14px; font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .maphint{ text-align:center; margin:0 0 14px; font-size:12px; }
  .pinpreview{
    display:flex; gap:12px; background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:10px; cursor:pointer; margin-bottom:14px;
  }
  .pp-img{ width:84px; height:84px; border-radius:14px; flex-shrink:0; background-size:cover; background-position:center; }
  .pp-body{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between; }
  .pp-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .pp-link{ font-size:12px; font-weight:600; color:var(--moss-deep); display:inline-flex; align-items:center; gap:2px; }
  .pp-link svg{ width:14px; height:14px; }

  /* ---------- buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;
    padding:15px; border-radius:16px; border:none; cursor:pointer; width:100%;
  }
  .btn-primary{ background:var(--ink); color:var(--canvas); }
  .btn-primary:active{ background:#132a1d; }
  .btn-ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---------- consent checkboxes ---------- */
  .consent-row{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; margin-bottom:10px; cursor:pointer;
  }
  .consent-box{
    width:20px; height:20px; border-radius:6px; flex-shrink:0; margin-top:1px;
    border:1.5px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; color:#fff;
    transition:.15s;
  }
  .consent-row.checked .consent-box{ background:var(--moss); border-color:var(--moss); }
  .consent-row p{ font-size:12px; line-height:1.5; color:var(--ink-soft); margin:0; }
  .consent-row a{ color:var(--ink); text-decoration:underline; font-weight:600; cursor:pointer; }
  .consent-row.addon-row.checked .consent-box{ background:var(--gold-deep); border-color:var(--gold-deep); }
  .consent-row p b{ color:var(--ink); }

  /* ---------- price summary ---------- */
  .pricebox-summary{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin:4px 0 18px;
  }
  .pb-row{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--ink-soft); }
  .pb-row b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .pb-row.total{ border-top:1px dashed var(--line); margin-top:4px; padding-top:10px; font-weight:600; color:var(--ink); }
  .pb-row.total b{ font-size:15.5px; }

  /* ---------- instant book / protect badge ---------- */
  .protect-badge{ display:flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; color:var(--moss-deep); margin-top:8px; }
  .protect-badge svg{ width:12px; height:12px; }

  /* ---------- loyalty / rewards ---------- */
  .pointsbanner{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--ink); color:var(--canvas); border-radius:18px; padding:18px 20px; margin-bottom:18px;
  }
  .pointsbanner b{ font-family:'Fraunces',serif; font-size:26px; display:block; }
  .pointsbanner span{ font-size:11.5px; color:var(--canvas); opacity:.75; text-transform:uppercase; letter-spacing:.06em; }
  .pointsbanner svg{ width:30px; height:30px; color:var(--gold); }
  .reward-row{
    display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
    border-radius:16px; padding:12px 14px; margin-bottom:10px;
  }
  .reward-row.locked{ opacity:.55; }
  .rw-icon{ width:38px; height:38px; border-radius:11px; background:rgba(227,162,59,0.16); color:var(--gold-deep); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .rw-body{ flex:1; min-width:0; }
  .rw-body b{ display:block; font-size:13px; }
  .rw-body span{ font-size:11px; color:var(--ink-soft); }

  /* ---------- session schedule ---------- */
  .session-row{
    display:flex; align-items:center; gap:12px; background:var(--paper); border:1px solid var(--line);
    border-radius:14px; padding:10px 14px; margin-bottom:8px; cursor:pointer;
  }
  .session-row.done{ opacity:.6; }
  .session-num{
    width:26px; height:26px; border-radius:50%; background:rgba(110,143,114,0.15); color:var(--moss-deep);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;
  }
  .session-body{ flex:1; min-width:0; }
  .session-body b{ display:block; font-size:13px; }
  .session-body span{ font-size:11px; color:var(--ink-soft); }
  .session-check{
    width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .session-row.done .session-check{ background:var(--moss); border-color:var(--moss); }

  /* ---------- policy document viewer ---------- */
  .policy-updated{ font-size:11px; color:var(--ink-soft); margin:-8px 0 18px; font-style:italic; }
  .policy-block h3{ font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--ink); margin:20px 0 8px; }
  .policy-block p{ font-size:13px; line-height:1.65; color:#333; margin:0 0 12px; }
  .policy-block ul{ margin:0 0 14px; padding-left:20px; }
  .policy-block li{ font-size:13px; line-height:1.6; color:#333; margin-bottom:8px; }
  .policy-table{ width:100%; border-collapse:collapse; margin:6px 0 16px; font-size:12px; }
  .policy-table th{ background:var(--ink); color:#fff; text-align:left; padding:8px 10px; font-size:11px; }
  .policy-table td{ padding:8px 10px; border-bottom:1px solid var(--line); color:#333; }
  .policyhub-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:10px; cursor:pointer; font-size:13.5px; font-weight:500;
  }
  .doc-row{
    display:flex; align-items:center; gap:14px;
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:10px; text-decoration:none;
  }
  .doc-icon{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .doc-info{ flex:1; min-width:0; }
  .doc-info b{ display:block; font-size:13.5px; color:var(--ink); font-family:'Fraunces',serif; font-weight:600; }
  .doc-info span{ font-size:11.5px; color:var(--ink-soft); }
  .doc-download{ color:var(--ink-soft); flex-shrink:0; }

  /* ---------- detail screen ---------- */
  .hero-img{
    height:230px; width:100%; background-size:cover; background-position:center;
    border-radius:0 0 28px 28px; position:relative; flex-shrink:0;
  }
  .hero-fade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(14,26,18,0.55) 100%); border-radius:0 0 28px 28px;}
  .hero-topbtn{
    position:absolute; top:16px; width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,0.85); backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
  }
  .hero-caption{
    position:absolute; bottom:14px; left:20px; right:20px; color:#fff;
  }
  .hero-caption h2{font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0 0 2px;}
  .hero-caption .loc{font-size:12.5px; opacity:.9; display:flex; gap:4px; align-items:center;}

  .statrow{ display:flex; gap:10px; margin:16px 0 6px; }
  .stat{
    flex:1; background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:10px; text-align:center;
  }
  .stat b{display:block; font-family:'Fraunces',serif; font-size:16px;}
  .stat span{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}

  .bio{ font-size:13.5px; line-height:1.6; color:var(--ink-soft); margin:14px 0; }

  .reviewcard{
    background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:10px;
  }
  .reviewcard .rh{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:4px;}
  .reviewcard p{font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.5;}

  /* ---------- trust badges ---------- */
  .trustbadges{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px;}
  .trustbadge{
    display:flex; align-items:center; gap:5px;
    font-size:11px; font-weight:600; color:var(--moss-deep);
    background:rgba(110,143,114,0.14);

  .trustbadge svg{width:12px;height:12px;flex-shrink:0;}
  .trustbadge.instant{ color:var(--gold-deep); background:rgba(227,162,59,0.18); }
  .responsetime{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);
    margin:8px 0 2px;
  }
  .responsetime svg{width:13px;height:13px;flex-shrink:0;color:var(--moss-deep);}

  /* ---------- stay updates ---------- */
  .stayupdate{
    display:flex; gap:12px; background:var(--paper); border:1px solid var(--line);
    border-radius:16px; padding:10px; margin-bottom:10px;
  }
  .su-img{width:64px;height:64px;border-radius:12px;flex-shrink:0; background-size:cover; background-position:center;}
  .su-body{flex:1; min-width:0;}
  .su-body p{font-size:13px; margin:0 0 4px; line-height:1.4;}
  .su-body span{font-size:11px; color:var(--ink-soft);}

  /* ---------- star picker (reviews) ---------- */
  .starpicker{display:flex; gap:6px;}
  .starpicker span{width:26px;height:26px; display:flex; align-items:center; justify-content:center; color:var(--line); cursor:pointer;}
  .starpicker span svg{width:22px;height:22px;}
  .starpicker span.filled{color:var(--gold);}

  /* ---------- SOS ---------- */
  .sos-btn{ border-color:var(--stamp) !important; color:var(--stamp) !important; display:flex; align-items:center; gap:8px; justify-content:center; }
  .sos-btn svg{width:16px;height:16px;}
  .sos-banner{
    background:rgba(193,68,46,0.1); border:1.5px solid rgba(193,68,46,0.3); border-radius:16px;
    padding:14px; display:flex; gap:10px; align-items:flex-start; margin-bottom:18px; color:var(--stamp);
  }

  .sos-banner p{margin:0; font-size:12.5px; line-height:1.5; color:var(--ink);}
  .sos-option{

  .sos-option span{font-size:11.5px; color:var(--ink-soft);}

  .ticket-brand .tb-name{ font-family:'Fraunces',serif; font-weight:700; font-size:15px;}
  .stampbadge{

  /* ---------- bottom nav ---------- */

  /* toast */
  .toast{

    padding:14px 16px; border-radius:14px;

  /* ---------- trust banner ---------- */
  .trustnote{

  /* ---------- credit card visual: true 3D flip ---------- */
  .cc-perspective{ position:relative; margin-bottom:20px; perspective:1400px; }
  .cc-flipper{
    position:relative; width:100%; aspect-ratio:1.586/1;
    transform-style:preserve-3d; -webkit-transform-style:preserve-3d;
    transform:rotateY(0deg);
    transition:transform .8s cubic-bezier(.45,.05,.15,1);
    border-radius:20px;
  }
  .cc-flipper.flipped{ transform:rotateY(180deg); }

  .cc-face{
    position:absolute; inset:0; border-radius:20px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    overflow:hidden; color:#F1EFE2;
    box-shadow:0 10px 20px -10px rgba(20,32,24,0.28);
    /* extra safety net: force the hidden face fully transparent exactly at the edge-on
       midpoint, so no browser can let the "wrong" face ghost/bleed through */
    transition:opacity 0s linear .4s;
  }
  .cc-flipper:not(.flipped) .cc-back{ opacity:0; }
  .cc-flipper.flipped .cc-front{ opacity:0; }
  .cc-front{
    background: linear-gradient(135deg, #1E3A2B 0%, #2C4A36 55%, #3E5C45 100%);
    padding:20px 22px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .cc-front::after{
    content:''; position:absolute; width:200px; height:200px; border-radius:50%;
    background:radial-gradient(circle, rgba(227,162,59,0.25), transparent 70%);
    top:-80px; right:-60px;
  }
  .cc-back{
    background: linear-gradient(135deg, #2C4A36 0%, #1E3A2B 100%);
    transform:rotateY(180deg);
    display:flex; flex-direction:column;
  }
  /* a genuine, physically-positioned right-hand edge — hinges with the card in real 3D
     space, so it naturally comes into view exactly when the card is edge-on, giving it
     real thickness instead of vanishing to a flat line. Solid (no transparency) so
     nothing behind it can show through, and inset slightly with a small radius of its
     own so it doesn't create a seam against the face's much larger corner radius. */
  .cc-edge{
    position:absolute; top:3px; right:0; width:8px; height:calc(100% - 6px);
    background:linear-gradient(90deg, #0C130E 0%, #4C6A53 45%, #0C130E 100%);
    transform-origin:right center;
    transform:rotateY(90deg);
    border-radius:3px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
  }
  .cc-stripe{ width:100%; height:38px; background:#14201A; margin-top:20px; }
  .cc-sigrow{ display:flex; align-items:center; gap:10px; margin:18px 20px 0; }
  .cc-sigline{
    flex:1; height:34px; border-radius:4px;

    min-width:44px; text-align:center;
  }
  .cc-backbottom{
    display:flex; align-items:center; gap:8px; margin:14px 20px 0;
    font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; opacity:.8;
  }

  .cc-scheme{

  .cc-number{

  .cc-bottom{ display:flex; justify-content:space-between; align-items:flex-end; z-index:1; }
  .cc-bottom div span{ display:block; font-size:8.5px; opacity:.7; text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px;}
  .cc-bottom div b{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:500; }


  .savedcard{

  .petcard{

/* ============ AVAILABILITY CALENDAR (fixed demo month: July 2026) ============ */
const CAL_MONTH = { year:2026, month:6, label:'July 2026' };
function renderMiniCalendar(blockedDates, editable){
  const year = CAL_MONTH.year, month = CAL_MONTH.month;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstDow = new Date(year, month, 1).getDay();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push('<div class="cal-cell empty"></div>');
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const blocked = blockedDates.includes(iso);
    cells.push(`<div class="cal-cell ${blocked?'blocked':'open'} ${editable?'editable':''}" ${editable?`data-action="toggle-avail-${iso}"`:''}>${d}</div>`);
  }
  return `
    <div class="cal-grid-head">${['S','M','T','W','T','F','S'].map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    <div class="cal-legend"><span><i class="caldot open"></i>Available</span><span><i class="caldot blocked"></i>Not available</span></div>
  `;
}
function isRangeBlocked(s, checkIn, checkOut){
  if(!s.blockedDates || !s.blockedDates.length) return false;
  let d = new Date(checkIn+'T00:00:00');
  const end = new Date(checkOut+'T00:00:00');
  while(d < end){
    const iso = d.toISOString().slice(0,10);
    if(s.blockedDates.includes(iso)) return true;
    d.setDate(d.getDate()+1);
  }
  return false;
}

/* ============ SEARCH, FILTER & MAP ============ */
const PET_WORDS_TR = { 'Dogs':'köpek köpekler', 'Cats':'kedi kediler', 'Small pets':'küçük hayvan tavşan hamster', 'Birds':'kuş kuşlar papağan' };
function norm(str){
  return String(str||'').toLocaleLowerCase('tr').replace(/ı/g,'i').normalize('NFD').replace(/[̀-ͯ]/g,'');
}
function escAttr(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function distKm(lat1,lng1,lat2,lng2){
  const R=6371, r=Math.PI/180;
  const dLat=(lat2-lat1)*r, dLng=(lng2-lng1)*r;
  const x=Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function fmtKm(km){
  const s = km.toFixed(1);
  return (state.lang==='tr' ? s.replace('.',',') : s) + ' km';
}
function countLabel(n, kind){
  if(state.lang==='tr') return kind==='sitter' ? `${n} bakıcı` : `${n} ilan`;
  return kind==='sitter' ? `${n} sitter${n===1?'':'s'}` : `${n} request${n===1?'':'s'}`;
}

function sitterHaystack(s){
  return norm([s.name, s.loc, s.area, s.tagline, s.bio, s.pets.join(' '), s.pets.map(p=>PET_WORDS_TR[p]||'').join(' ')].join(' '));
}
function filteredSitters(){
  const f = state.search, u = state.userLoc;
  const words = norm(f.q).trim().split(/\s+/).filter(Boolean);
  let list = SITTERS.map(s => ({ s, dist: u ? distKm(u.lat,u.lng,s.lat,s.lng) : null }));
  list = list.filter(({s,dist}) => {
    if(state.filter!=='All' && !s.pets.includes(state.filter)) return false;
    if(words.length){ const h = sitterHaystack(s); if(!words.every(w=>h.includes(w))) return false; }
    if(f.area!=='All' && s.area!==f.area) return false;
    if(f.maxPrice<700 && parsePrice(s.price)>f.maxPrice) return false;
    if(f.instant && !s.instantBook) return false;
    if(f.fast && s.responseMinutes>60) return false;
    if(f.checkIn && f.checkOut && f.checkOut>f.checkIn && isRangeBlocked(s,f.checkIn,f.checkOut)) return false;
    if(f.maxDist && dist!=null && dist>f.maxDist) return false;
    return true;
  });
  const sorters = {
    rating:     (a,b)=> b.s.rating-a.s.rating || b.s.reviews-a.s.reviews,
    price_asc:  (a,b)=> parsePrice(a.s.price)-parsePrice(b.s.price),
    price_desc: (a,b)=> parsePrice(b.s.price)-parsePrice(a.s.price),
    response:   (a,b)=> a.s.responseMinutes-b.s.responseMinutes,
    distance:   (a,b)=> (a.dist==null?1e9:a.dist)-(b.dist==null?1e9:b.dist),
  };
  list.sort(sorters[f.sort] || sorters.rating);
  return list;
}
function requestHaystack(r){
  return norm([r.pet, r.type, r.owner, r.loc, r.dates, r.notes, r.goal||'', (/Dog/.test(r.type)?'köpek':''), (/Cat/.test(r.type)?'kedi':'')].join(' '));
}
function filteredRequests(list){
  const words = norm(state.search.q).trim().split(/\s+/).filter(Boolean);
  return list.filter(r => {
    if(state.filter!=='All' && !r.type.includes(state.filter)) return false;
    if(words.length){ const h = requestHaystack(r); if(!words.every(w=>h.includes(w))) return false; }
    return true;
  });
}
function activeFilterCount(){
  const f = state.search;
  return (f.area!=='All'?1:0) + (f.maxPrice<700?1:0) + (f.instant?1:0) + (f.fast?1:0) + ((f.checkIn&&f.checkOut)?1:0) + (f.maxDist?1:0);
}

const MAP = { lonMin:28.80, latMax:41.26, kx:84*9, ky:111*9, W:302, H:360 };
function mapXY(lat,lng){ return { x:(lng-MAP.lonMin)*MAP.kx, y:(MAP.latMax-lat)*MAP.ky }; }
function mapPath(points, close){
  return points.map((p,i)=>{ const q=mapXY(p[0],p[1]); return (i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1); }).join(' ') + (close?' Z':'');
}
const MAP_BLACKSEA = [[41.30,28.855],[41.30,29.40],[41.16,29.40],[41.195,29.25],[41.215,29.15],[41.225,29.115],[41.235,29.10],[41.25,29.04]];
const MAP_MARMARA  = [[40.985,28.70],[40.98,28.78],[40.96,28.82],[40.975,28.87],[40.995,28.93],[41.005,28.97],[41.012,28.985],[41.0,29.015],[40.985,29.025],[40.965,29.04],[40.95,29.09],[40.925,29.13],[40.90,29.19],[40.875,29.23],[40.82,29.30],[40.80,29.34],[40.80,28.70]];

const MAP_GOLDENHORN = [[41.015,28.975],[41.027,28.965],[41.04,28.95],[41.048,28.94],[41.057,28.93]];

function mapViewBox(){
  const mv = state.search.mv;
  const w = MAP.W/mv.s, h = MAP.H/mv.s;
  const x = Math.max(0, Math.min(MAP.W-w, mv.x)), y = Math.max(0, Math.min(MAP.H-h, mv.y));
  mv.x = x; mv.y = y;
  return { x, y, w, h };
}
function renderSitterMap(list){
  const mv = state.search.mv, vb = mapViewBox();
  const k = 1/mv.s;                      // keep pins a constant on-screen size
  const sea = '#BFD8DD', land = '#EAE6D0', seaDeep = '#9DC3CB';
  const lbl = (lat,lng,txt,size,extra) => { const p=mapXY(lat,lng); return `<text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" font-size="${size*k}" text-anchor="middle" ${extra||''}>${txt}</text>`; };

    const p = mapXY(s.lat,s.lng), sel = state.search.pin===s.id;
    const r = (sel?9:7)*k;
    return `<g class="mappin ${sel?'sel':''}" data-action="map-pin-${s.id}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})">
      <circle r="${r+4*k}" fill="transparent"/>
      <circle r="${r}" fill="${sel?'#C1442E':'#1E3A2B'}" stroke="#fff" stroke-width="${2*k}"/>
      ${mv.s>=1.8||sel ? `<g transform="translate(0 ${-(r+9*k)})"><rect x="${-19*k}" y="${-8*k}" width="${38*k}" height="${16*k}" rx="${8*k}" fill="#fff" stroke="#DAD5BF" stroke-width="${k}"/><text y="${4*k}" font-size="${10*k}" font-weight="700" text-anchor="middle" fill="#1E3A2B">${s.price}</text></g>` : `<circle r="${2.4*k}" fill="#E3A23B"/>`}
    </g>`;
  }).join('');
  let me = '';
  if(state.userLoc){
    const p = mapXY(state.userLoc.lat, state.userLoc.lng);
    me = `<g transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})"><circle r="${16*k}" fill="#2C5CE0" opacity=".16"/><circle r="${6*k}" fill="#2C5CE0" stroke="#fff" stroke-width="${2*k}"/></g>`;

  return `
  <div class="mapwrap">
    <svg class="mapsvg" id="mapsvg" viewBox="${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Istanbul map">
      <rect x="0" y="0" width="${MAP.W}" height="${MAP.H}" fill="${land}"/>
      <path d="${mapPath(MAP_BLACKSEA,true)}" fill="${sea}"/>
      <path d="${mapPath(MAP_MARMARA,true)}" fill="${sea}"/>
      <path d="${mapPath(MAP_BOSPHORUS)}" fill="none" stroke="${sea}" stroke-width="${6.5}" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${mapPath(MAP_GOLDENHORN)}" fill="none" stroke="${sea}" stroke-width="${4.5}" stroke-linecap="round" stroke-linejoin="round"/>
      ${area(41.085,28.88,t('map_europe'))}
      ${area(40.935,29.105,t('map_anatolia'))}
      ${water(41.243,29.08,t('map_blacksea'))}
      ${water(40.86,28.95,t('map_marmara'))}
      ${me}
      ${pins}
    </svg>
    <div class="mapctl">
      <button data-action="map-zoom-in" aria-label="Zoom in">+</button>

    ${state.userLoc ? `<div class="maplegend"><i></i>${t('map_you')} · ${state.userLoc.mock ? t('loc_mock') : t('loc_label')}</div>` : ''}
  </div>
  ${(() => {
    const sel = list.find(x=>x.s.id===state.search.pin);
    if(!sel) return `<p class="subtitle maphint">${t('map_tap_pin')}</p>`;
    const s = sel.s;

        <div class="card-loc">${ICON.pin}${s.loc}${sel.dist!=null ? ` · ${fmtKm(sel.dist)}` : ''}</div>
        <div class="pp-foot"><div class="price" style="margin:0">${s.price} <span>/ night</span></div><span class="pp-link">${t('map_view_profile')} ${ICON.chevron}</span></div>
      </div>
    </div>`;
  })()}`;
}

/* drag-to-pan for the SVG map (pointer events; viewBox is updated directly, no re-render) */
let mapDragEnd = 0, mapDragMoved = false;
function bindMapDrag(){
  const svg = document.getElementById('mapsvg');
  if(!svg || svg.dataset.bound) return;
  svg.dataset.bound = '1';
  let start = null;
  svg.addEventListener('pointerdown', e => {
    const mv = state.search.mv;
    start = { px:e.clientX, py:e.clientY, x:mv.x, y:mv.y };
    mapDragMoved = false;
  });
  svg.addEventListener('pointermove', e => {
    if(!start) return;
    const dx = e.clientX-start.px, dy = e.clientY-start.py;
    if(!mapDragMoved && Math.hypot(dx,dy) < 5) return;
    mapDragMoved = true;
    const rect = svg.getBoundingClientRect(), mv = state.search.mv;
    const unit = Math.max(MAP.W/mv.s/rect.width, MAP.H/mv.s/rect.height);   // svg units per css px ("slice" fit)
    mv.x = start.x - dx*unit; mv.y = start.y - dy*unit;
    const vb = mapViewBox();
    svg.setAttribute('viewBox', `${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);
  });
  const end = () => { if(start && mapDragMoved) mapDragEnd = Date.now(); start = null; };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointerleave', end);
  svg.addEventListener('pointercancel', end);
}

  const isHostView = state.mode!=='owner';
  if(isHostView){
    if(b.review){
      return `
      <div class="section-label">Owner's review</div>
      ${renderReviewCard(b.review)}
      `;
    }
    if(b.trainerBooking){
      return `
      <div class="section-label">Review</div>
      <p class="subtitle" style="margin-top:-6px;">No review yet — this is a mock, so you can simulate the owner leaving one.</p>
      <button class="btn btn-ghost" data-action="simulate-trainer-review-${b.id}">Simulate: ask ${(b.ownerName||'owner').split(' ')[0]} to review</button>
      `;
    }
    return `
      <div class="section-label">Review</div>
      <p class="subtitle" style="margin-top:-6px;">The owner hasn't left a review yet.</p>
    `;
  }
  if(b.review){
    return `<div class="section-label">Your review</div>${renderReviewCard(b.review)}`;
  }
  if(!b.sitterId) return '';
  return `
    <div class="section-label">How did it go?</div>
    <button class="btn btn-primary" data-action="nav2-review-${b.id}">Leave a review</button>
  `;
}

function screenBookingDetail(){

  const isHost = state.mode==='sitter' || state.mode==='trainer';
  return `
  <div class="fade-in narrow">
    ${renderTicketCard(b, false)}
    ${b.status==='cancelled' ? `
      <div class="sos-banner" style="margin-top:16px;">${ICON.alert}<p>This pawcation was cancelled${b.cancelReason ? ': '+b.cancelReason : '.'}</p></div>

    <div style="display:flex;gap:10px;margin:16px 0 6px;">
      ${b.status==='confirmed' ? `<button class="btn btn-ghost sos-btn" data-action="open-sos-${b.id}">${ICON.alert}SOS</button>` : ''}
      ${b.status==='confirmed' && isHost ? `<button class="btn btn-primary" data-action="complete-booking-${b.id}" style="flex:1;">Mark stay as completed</button>` : ''}
    </div>
    ${(b.status==='pending' || b.status==='confirmed') ? `
      <div style="display:flex;gap:10px;margin-bottom:16px;">
        <button class="btn btn-ghost" style="flex:1;color:var(--stamp);border-color:var(--stamp);" data-action="open-cancel-${b.id}">Cancel pawcation</button>
        ${b.status==='confirmed' ? `<button class="btn btn-ghost" style="flex:1;" data-action="open-reschedule-${b.id}">Reschedule</button>` : ''}
      </div>
    ` : ''}
    ${b.sessions ? `
      <div class="section-label">Session schedule${b.goal ? ' — '+b.goal : ''}</div>
      ${b.sessions.map((s,i)=>`
        <div class="session-row ${s.done?'done':''}" ${b.status!=='cancelled' ? `data-action="toggle-session-${b.id}-${i}"` : ''}>
          <div class="session-num">${i+1}</div>
          <div class="session-body"><b>${s.date}</b><span>${s.time}</span></div>
          <div class="session-check">${s.done ? ICON.check.replace('26','13').replace('26','13') : ''}</div>

      `).join('')}
    ` : ''}
    <div class="section-label">Stay updates</div>
    ${b.updates.length===0 ? `<p class="subtitle" style="margin-top:-6px;">${isHost ? "Post a photo so the owner can see how things are going." : "No updates yet — your sitter or trainer will post photos here during the stay."}</p>` : ''}
    ${b.updates.slice().reverse().map(u=>`
      <div class="stayupdate">
        <div class="su-img" style="background-image:url('${u.photo}')"></div>
        <div class="su-body"><p>${u.note}</p><span>${u.when}</span></div>
      </div>
    `).join('')}
    ${isHost && b.status==='confirmed' ? `
      <div class="section-label">Post an update</div>
      <div class="upload-tile" style="margin-bottom:10px;" data-upload="stayUpdatePhoto">
        <div style="color:var(--ink-soft)">${ICON.camera}</div><div class="uplabel-empty">Add a photo</div>
        <input type="file" accept="image/*" data-upload-input="stayUpdatePhoto"/>
      </div>
      <div class="field"><textarea id="su-note" placeholder="What's happening right now?"></textarea></div>
      <button class="btn btn-ghost" data-action="post-update-${b.id}">Post update</button>
    ` : ''}
    ${b.status==='completed' ? renderReviewSection(b) : ''}
  </div>`;
}

function screenLeaveReview(){
  const b = state.bookings.find(x=>x.id===state.selectedId);

  if(!state.reviewDraft) state.reviewDraft = { overall:5, cleanliness:5, communication:5, punctuality:5, text:'' };

  const starRow = (key,label) => `
    <div class="field">
      <label>${label}</label>
      <div class="starpicker">

function screenMessages(){
  const prefix = state.mode==='owner' ? 'owner-' : state.mode==='sitter' ? 'sitter-' : 'trainer-';
  const ids = Object.keys(state.chats).filter(id=>id.startsWith(prefix));
  return `
  <div class="fade-in narrow">
    <h2 class="title">${t('title_messages')}</h2>

        <h3>No conversations yet</h3>
        <p>Messages tied to your requests will show up here.</p>
      </div>` : ids.map(id=>{

        return `
      <div class="msgrow" data-action="open-chat-${id}">
        <div class="avatar" style="background-image:url('${t.img}')"></div>
        <div class="mbody">
          <div class="mtop"><b>${t.name}</b><span>${last.when}</span></div>

      : `<div class="profile-row" data-action="${isOwner ? 'nav2-mypets' : 'nav2-availability'}"><div class="left">${isOwner ? ICON.paw : ICON.calendar}<span>${isOwner ? t('profile_mypets') : t('profile_availability')}</span></div>${isOwner ? `<span style="color:var(--ink-soft);font-size:12px;">${state.myPets.length} added</span>` : `<span style="color:var(--ink-soft);font-size:12px;">${state.myBlockedDates.length} blocked</span>`}${ICON.chevron}</div>`}

function renderPolicyBlock(block){
  if(block.h) return `<h3>${block.h}</h3>`;
  if(block.p) return `<p>${block.p}</p>`;
  if(block.li) return `<ul>${block.li.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  if(block.table) return `<table class="policy-table"><tr><th>Durum</th><th>Sonuç</th></tr>${block.table.map(row=>`<tr><td>${row[0]}</td><td>${row[1]}</td></tr>`).join('')}</table>`;
  return '';
}

/* ============ EVENTS ============ */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  // a drag on the map must not count as a tap on a pin
  if(mapDragMoved && Date.now()-mapDragEnd < 300 && action.startsWith('map-')){ return; }

  /* ---- search / filter / map ---- */
  if(action==='search-clear'){ state.search.q=''; render(); return; }
  if(action==='flt-toggle'){ state.search.panel = !state.search.panel; render(); return; }
  if(action==='view-list'){ state.search.view='list'; render(); return; }
  if(action==='view-map'){ state.search.view='map'; render(); return; }
  if(action.startsWith('flt-area-')){ state.search.area = action.replace('flt-area-',''); render(); return; }
  if(action==='flt-instant'){ state.search.instant = !state.search.instant; render(); return; }
  if(action==='flt-fast'){ state.search.fast = !state.search.fast; render(); return; }
  if(action.startsWith('flt-dist-')){ state.search.maxDist = parseInt(action.replace('flt-dist-',''),10)||0; render(); return; }
  if(action==='flt-clear'){
    Object.assign(state.search, { q:'', area:'All', maxPrice:700, instant:false, fast:false, checkIn:'', checkOut:'', maxDist:0, pin:null });
    state.filter = 'All';
    if(state.search.sort==='distance' && !state.userLoc) state.search.sort='rating';
    render(); return;
  }
  if(action==='flt-near'){
    if(state.userLoc){
      state.userLoc = null; state.search.maxDist = 0;
      if(state.search.sort==='distance') state.search.sort = 'rating';
      render(); return;
    }
    const setLoc = (lat,lng,mock) => {
      state.userLoc = { lat, lng, mock };
      state.search.sort = 'distance';
      render();
      toast(t(mock ? 'toast_loc_mock' : 'toast_loc_ok'));
    };
    const fallback = () => setLoc(40.987, 29.026, true);
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos => { const la=pos.coords.latitude, lo=pos.coords.longitude; (la>40.80 && la<41.35 && lo>28.60 && lo<29.50) ? setLoc(la,lo,false) : fallback(); },
        fallback, { timeout:3500, maximumAge:600000 });
    } else fallback();
    return;
  }
  if(action.startsWith('map-pin-')){
    const id = action.replace('map-pin-','');
    state.search.pin = (state.search.pin===id) ? null : id;
    refreshResults();
    return;
  }
  if(action==='map-zoom-in' || action==='map-zoom-out'){
    const mv = state.search.mv;
    const cx = mv.x + MAP.W/mv.s/2, cy = mv.y + MAP.H/mv.s/2;
    mv.s = Math.max(1, Math.min(4, mv.s * (action==='map-zoom-in' ? 1.6 : 1/1.6)));
    if(mv.s < 1.05) mv.s = 1;
    mv.x = cx - MAP.W/mv.s/2; mv.y = cy - MAP.H/mv.s/2;
    refreshResults();
    return;
  }

  if(action==='pick-owner'){ state.onboarded=true; state.mode='owner'; go('browse'); return; }
  if(action==='pick-sitter'){ state.onboarded=true; state.mode='sitter'; go('browse'); return; }
  if(action==='pick-trainer'){ state.onboarded=true; state.mode='trainer'; go('browse'); return; }
  if(action==='set-lang-en'){ setLang('en'); return; }
  if(action==='set-lang-tr'){ setLang('tr'); return; }
  if(action==='tour-skip'){ go('onboard'); return; }
  if(action==='tour-next'){
    if((state.tourStep||0) >= 3){ go('onboard'); }
    else { state.tourStep = (state.tourStep||0) + 1; render(); }
    return;
  }
  if(action && action.startsWith('tour-dot-')){ state.tourStep = parseInt(action.replace('tour-dot-','')); render(); return; }
  if(action==='nav2-tour'){ state.tourStep = 0; go('tour'); return; }
  if(action==='mode-owner'){ setMode('owner'); return; }
  if(action==='mode-sitter'){ setMode('sitter'); return; }
  if(action==='mode-trainer'){ setMode('trainer'); return; }
  if(action==='tap-bell'){ state.notifications.forEach(n=> n.read=true); go('notifications'); return; }
  if(action==='back'){
    if(state.screen==='detail' || state.screen==='requestDetail' || state.screen==='trainingDetail') go('browse');
    else if(state.screen==='request') go('detail', {selectedId:state.selectedId});
    else if(state.screen==='ticket') go('bookings');
    else if(state.screen==='addpet') go('mypets');
    else if(state.screen==='policy') go(state.policyReturnTo || 'policyhub');
    else if(state.screen==='policyhub') go('profile');
    else if(state.screen==='documents') go('profile');
    else if(state.screen==='bookingDetail') go('bookings');
    else if(state.screen==='sos') go('bookingDetail', {selectedId:state.selectedId});
    else if(state.screen==='leaveReview'){ state.reviewDraft=null; go('bookingDetail', {selectedId:state.selectedId}); }
    else if(state.screen==='cancelBooking' || state.screen==='reschedule') go('bookingDetail', {selectedId:state.selectedId});
    else if(state.screen==='chatThread') go('messages');
    else if(['verify','payment','mypets','trainercv','notifications','rewards','availability','favorites','tour'].includes(state.screen)) go('profile');
    else go('browse');
    return;
  }
  if(action.startsWith('open-policy-')){
    const rest = action.replace('open-policy-','').split('-');
    const returnTo = rest.pop();
    const key = rest.join('-');
    state.activePolicy = key;
    state.policyReturnTo = returnTo;
    go('policy');
    return;
  }
  if(action==='nav2-policyhub'){ go('policyhub'); return; }
  if(action==='nav2-documents'){ go('documents'); return; }
  if(action==='nav2-rewards'){ go('rewards'); return; }
  if(action.startsWith('redeem-reward-')){
    const id = action.replace('redeem-reward-','');
    const r = REWARDS.find(x=>x.id===id);
    if(!r || state.loyaltyPoints < r.cost){ toast('Not enough points yet'); return; }
    state.loyaltyPoints -= r.cost;
    state.redeemedRewards.push({ title:r.title, when:'Just now', code:'PWC-'+Math.random().toString(36).slice(2,7).toUpperCase() });
    toast(r.title+' redeemed!');
    render();
    return;
  }
  if(action==='nav2-availability'){ go('availability'); return; }
  if(action.startsWith('toggle-avail-')){
    const iso = action.replace('toggle-avail-','');
    const idx = state.myBlockedDates.indexOf(iso);
    if(idx>-1) state.myBlockedDates.splice(idx,1); else state.myBlockedDates.push(iso);
    render();
    return;
  }
  if(action==='nav2-favorites'){ go('favorites'); return; }
  if(action.startsWith('toggle-fav-')){
    const id = action.replace('toggle-fav-','');
    const idx = state.favorites.indexOf(id);
    if(idx>-1){ state.favorites.splice(idx,1); toast('Removed from favorites'); }
    else { state.favorites.push(id); toast('Added to favorites'); }
    render();
    return;
  }
  if(action.startsWith('open-chat-')){
    const id = action.replace('open-chat-','');
    if(state.chats[id]) state.chats[id].unread = false;
    go('chatThread', {selectedId:id});
    app.content.scrollTop = app.content.scrollHeight;
    return;
  }
  if(action.startsWith('send-chat-')){
    const id = action.replace('send-chat-','');
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if(!text) return;
    const t = state.chats[id];
    t.messages.push({from:'me', text, when:'Just now'});
    go('chatThread', {selectedId:id});
    app.content.scrollTop = app.content.scrollHeight;
    setTimeout(()=>{
      if(state.screen==='chatThread' && state.selectedId===id){
        const replies = ["Got it, thank you!", "Sounds good 👍", "Will do — I'll keep you posted.", "Perfect, see you then!"];
        t.messages.push({from:'them', text: replies[Math.floor(Math.random()*replies.length)], when:'Just now'});
        render();
        app.content.scrollTop = app.content.scrollHeight;
      }
    }, 1300);
    return;
  }
  if(action.startsWith('open-cancel-')){ go('cancelBooking', {selectedId: action.replace('open-cancel-','')}); return; }
  if(action.startsWith('confirm-cancel-')){
    const id = action.replace('confirm-cancel-','');
    const b = state.bookings.find(x=>x.id===id);
    const reason = document.getElementById('cancel-reason').value;
    if(b){ b.status='cancelled'; b.cancelReason = reason; }
    toast('Pawcation cancelled');
    go('bookingDetail', {selectedId:id});
    return;
  }
  if(action.startsWith('open-reschedule-')){ go('reschedule', {selectedId: action.replace('open-reschedule-','')}); return; }
  if(action.startsWith('confirm-reschedule-')){
    const id = action.replace('confirm-reschedule-','');
    const b = state.bookings.find(x=>x.id===id);
    const newIn = document.getElementById('resch-in').value;
    const newOut = document.getElementById('resch-out').value;
    if(b){ b.checkIn = newIn; b.checkOut = newOut; b.status = 'pending'; }
    toast('New dates sent — waiting for confirmation');
    go('bookingDetail', {selectedId:id});
    return;
  }
  if(action.startsWith('nav-')){ go(action.replace('nav-','')); return; }
  if(action.startsWith('filter-')){ state.filter = action.replace('filter-',''); render(); return; }
  if(action.startsWith('open-sitter-')){ go('detail', {selectedId: action.replace('open-sitter-','')}); return; }
  if(action.startsWith('open-request-')){ go('requestDetail', {selectedId: action.replace('open-request-','')}); return; }
  if(action.startsWith('open-training-')){ go('trainingDetail', {selectedId: action.replace('open-training-','')}); return; }
  if(action.startsWith('request-stay-')){
    state.consent.petHealth = false;
    state.consent.vetConsent = false;
    state.form.protect = false;
    go('request', {selectedId: action.replace('request-stay-','')});
    return;
  }
  if(action==='toggle-protect'){ state.form.protect = !state.form.protect; render(); return; }

  if(action.startsWith('confirm-request-')){
    const id = action.replace('confirm-request-','');
    const s = SITTERS.find(x=>x.id===id);
    const petName = document.getElementById('f-petname').value || 'Your pet';
    const checkIn = document.getElementById('f-in').value || '2026-07-10';
    const checkOut = document.getElementById('f-out').value || '2026-07-14';
    if(isRangeBlocked(s, checkIn, checkOut)){
      toast(s.name.split(' ')[0]+" isn't available for some of those dates");
      return;
    }
    const nights = computeNights(checkIn, checkOut);
    const protect = state.form.protect;
    const protectFee = 99;
    const total = nights*parsePrice(s.price) + (protect ? protectFee : 0);
    const booking = {
      id: 'b'+Date.now(), status: s.instantBook ? 'confirmed' : 'pending',
      petName, hostName: s.name, loc: s.loc.split(',')[0],
      checkIn: fmtDate(checkIn), checkOut: fmtDate(checkOut),
      code: randCode(), sitterId: s.id, updates: [], review: null,
      protect, protectFee: protect ? protectFee : 0, total
    };
    state.bookings.push(booking);
    state.loyaltyPoints += 50;
    state.form.protect = false;
    toast((s.instantBook ? 'Confirmed with ' : 'Request sent to ')+s.name.split(' ')[0]+' · +50 points');
    go('ticket', {selectedId: booking.id});
    return;
  }

  if(action.startsWith('offer-sit-')){
    const id = action.replace('offer-sit-','');
    const r = REQUESTS.find(x=>x.id===id);

/* ---- live credit card preview: network detection (local) + bank detection (live BIN lookup) ---- */
let currentCardDetect = { scheme: null, bankName: null };
let binLookupTimer = null;
let binLookupToken = 0;

const SCHEME_PATTERNS = [
  { name: 'Troy',        test: n => /^9792/.test(n) },
  { name: 'Amex',        test: n => /^3[47]/.test(n) },
  { name: 'Diners Club', test: n => /^3(?:0[0-5]|[68])/.test(n) },
  { name: 'JCB',         test: n => /^35(?:2[89]|[3-8]\d)/.test(n) },
  { name: 'Discover',    test: n => /^(?:6011|65|64[4-9])/.test(n) },
  { name: 'Mastercard',  test: n => /^(?:5[1-5]|22[2-9]|2[3-6]\d|27[01]\d|2720)/.test(n) },
  { name: 'Visa',        test: n => /^4/.test(n) },
];
/* Brand badge styling — original color/abbreviation pairing, not a reproduction of any brand's official logo artwork */
const SCHEME_META = {
  'Visa':         { bg:'#2C5CE0', abbr:'VISA' },
  'Mastercard':   { bg:'#D9542F', abbr:'MC'   },
  'Amex':         { bg:'#2E7D74', abbr:'AMEX' },
  'Troy':         { bg:'#B8433A', abbr:'TROY' },
  'Discover':     { bg:'#CB7B1E', abbr:'DISC' },
  'Diners Club':  { bg:'#5B6B7A', abbr:'DIN'  },
  'JCB':          { bg:'#3D6B8C', abbr:'JCB'  },
};
function detectScheme(number){
  const hit = SCHEME_PATTERNS.find(p => p.test(number));
  return hit ? hit.name : null;
}

function setBankLine(html){
  const el = document.getElementById('cc-prev-bank');
  if(el) el.innerHTML = html;
}

function lookupBank(bin){
  const myToken = ++binLookupToken;
  setBankLine(`<span class="spinner"></span> Looking up issuing bank…`);
  fetch(`https://lookup.binlist.net/${bin}`, { headers: { 'Accept-Version': '3' } })
    .then(res => { if(!res.ok) throw new Error('not found'); return res.json(); })
    .then(data => {
      if(myToken !== binLookupToken) return; // a newer keystroke superseded this lookup
      const bankName = data.bank && data.bank.name ? data.bank.name : null;
      const country = data.country && data.country.emoji ? ' ' + data.country.emoji : '';
      currentCardDetect.bankName = bankName;
      setBankLine(bankName ? `${bankName}${country}` : 'Bank not identified');
    })
    .catch(() => {
      if(myToken !== binLookupToken) return;
      currentCardDetect.bankName = null;
      setBankLine('Bank not identified');
    });
}

  const d1 = new Date(inStr+'T00:00:00'), d2 = new Date(outStr+'T00:00:00');

function generateSessions(count, startISO){
  const sessions = [];

    d.setDate(d.getDate()+7);
  }
  return sessions;
}

/* ============ TURKISH TRANSLATION LAYER ============
   Screens are still written in English; when state.lang === 'tr' every rendered text node,
   placeholder and toast is translated after it hits the DOM (exact phrases first, then patterns).
   Logic never reads the translated text — data-action / option values stay untouched. */
const TR_MONTHS = {Jan:'Oca',Feb:'Şub',Mar:'Mar',Apr:'Nis',May:'May',Jun:'Haz',Jul:'Tem',Aug:'Ağu',Sep:'Eyl',Oct:'Eki',Nov:'Kas',Dec:'Ara'};
const TR_MONTHS_LONG = {January:'Ocak',February:'Şubat',March:'Mart',April:'Nisan',May:'Mayıs',June:'Haziran',July:'Temmuz',August:'Ağustos',September:'Eylül',October:'Ekim',November:'Kasım',December:'Aralık'};

/* Turkish case suffixes for names (dative / accusative / genitive / ablative) */
function trSuffix(name, kind){
  const w = String(name).trim();
  let back = false, round = false;
  for(let i=w.length-1;i>=0;i--){
    const c = w[i];
    if('aıouAIOUâ'.includes(c)){ back = true; round = 'ouOU'.includes(c); break; }
    if('eiöüEİÖÜ'.includes(c)){ back = false; round = 'öüÖÜ'.includes(c); break; }
  }
  const endsVowel = /[aeıioöuüAEIİOÖUÜ]$/.test(w);
  const two = back ? 'a' : 'e';
  const four = back ? (round ? 'u' : 'ı') : (round ? 'ü' : 'i');
  if(kind==='dat') return w+"'"+(endsVowel?'y':'')+two;
  if(kind==='acc') return w+"'"+(endsVowel?'y':'')+four;
  if(kind==='gen') return w+"'"+(endsVowel?'n':'')+four+'n';
  if(kind==='abl') return w+"'"+(/[çfhkpsşt]$/i.test(w)?'t':'d')+two+'n';
  return w;
}

  [/^Propose new dates for this pawcation — (.+) will need to confirm them\.$/, (m,n)=> `Bu pawcation için yeni tarihler öner — ${trSuffix(n,'gen')} onaylaması gerekecek.`],
  [/^Reviews(?: · (.+))?$/, (m,r)=> 'Yorumlar' + (r ? ' · '+r : '')],
  [/^(\d+) years? of experience$/, (m,n)=> `${n} yıl deneyim`],
  [/^(\d+) (?:points|pts)$/, (m,n)=> `${n} puan`],
  [/^(\d+) added$/, (m,n)=> `${n} eklendi`],
  [/^(\d+) blocked$/, (m,n)=> `${n} gün kapalı`],
  [/^(\d+) saved$/, (m,n)=> `${n} kayıtlı`],
  [/^(\d+)\+ stays$/, (m,n)=> `${n}+ kalış`],
  [/^(\d+) sessions?$/, (m,n)=> `${n} seans`],
  [/^(\d+) yr$/, (m,n)=> `${n} yaş`],
  [/^₺(\d+) off your next booking$/, (m,n)=> `Sonraki rezervasyonunda ₺${n} indirim`],
  [/^(.+) redeemed!$/, (m,t)=> `${trCore(t)} kullanıldı!`],
  [/^Code: (.+)$/, (m,c)=> `Kod: ${c}`],
  [/^(Confirmed with|Request sent to) (.+?) · \+50 points$/, (m,k,n)=> k==='Confirmed with' ? `${n} ile rezervasyon onaylandı · +50 puan` : `${trSuffix(n,'dat')} talep gönderildi · +50 puan`],
  [/^Offer sent to (.+)$/, (m,n)=> `Teklif ${trSuffix(n,'dat')} gönderildi`],
  [/^(.+) left a review!$/, (m,n)=> `${n} yorum bıraktı!`],
  [/^(.+) added to your pets$/, (m,n)=> `${n} hayvanlarına eklendi`],
  [/^(Cleanliness|Communication|Punctuality) (\d)★$/, (m,k,n)=> `${TR_EXACT[k]} ${n}★`],
  [/^Total paid: (.+)$/, (m,a)=> `Ödenen toplam: ${trMoney(a)}`],
  [/^PASS · (.+)$/, (m,c)=> `KART · ${c}`],
  [/^Expires (.+)$/, (m,d)=> `Son kullanma ${d}`],
  [/^IBAN ending (.+)$/, (m,d)=> `IBAN sonu ${d}`],
  [/^sent for (.+)'s (stay|training)$/, (m,p,k)=> `${p} için ${k==='stay'?'kalış':'eğitim'} ödemesi gönderdi`],
  [/^You: ([\s\S]*)$/, (m,x)=> `Sen: ${x}`],
  [/^(\d+)m$/, (m,n)=> `${n} dk`],
  [/^(\d+)h$/, (m,n)=> `${n} sa`],
  [/^(\d+) (hours?|days?|weeks?) ago$/, (m,n,u)=> `${n} ${TR_WHEN[u]} önce`],
  [/^Today, (.+)$/, (m,x)=> `Bugün, ${x}`],
  [/^Availability — (.+)$/, (m,x)=> `Müsaitlik — ${trCore(x)}`],
  [/^(January|February|March|April|May|June|July|August|September|October|November|December) (\d{4})$/, (m,mo,y)=> `${TR_MONTHS_LONG[mo]} ${y}`],
  [/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{1,2})$/, (m,mo,d)=> `${d} ${TR_MONTHS[mo]}`],
  [/^(\d{1,2}):(\d{2}) (AM|PM)$/, (m,h,mi,ap)=> { let H = parseInt(h,10)%12 + (ap==='PM'?12:0); return String(H).padStart(2,'0')+':'+mi; }],
  [/^₺([\d,]+) total$/, (m,a)=> trMoney('₺'+a)+' toplam'],
];

function trCore(c){
  if(Object.prototype.hasOwnProperty.call(TR_EXACT, c)) return TR_EXACT[c];
  for(const [re,fn] of TR_PATTERNS){ const m = c.match(re); if(m) return fn(...m); }
  for(const sep of [' · ',' – ']){
    if(c.includes(sep)){
      const parts = c.split(sep), out = parts.map(trCore);
      if(out.some((o,i)=>o!==parts[i])) return out.join(sep);
    }
  }
  return trMoney(c.replace(/\bIstanbul\b/g,'İstanbul').replace(/\bTurkey\b/g,'Türkiye'));
}
function trText(raw){
  const core = raw.trim();
  if(!core) return raw;
  const out = trCore(core);
  if(out===core) return raw;
  return raw.slice(0, raw.indexOf(core)) + out + raw.slice(raw.indexOf(core)+core.length);
}
function trApply(node){
  if(state.lang!=='tr' || !node) return;
  if(node.nodeType===3){
    const par = node.parentNode, p = par && par.nodeName;
    if(p==='SCRIPT' || p==='STYLE') return;
    if(p==='P' && par.closest && par.closest('.chat-bubble.me')) return;   // never rewrite what the user typed
    const o = trText(node.nodeValue); if(o!==node.nodeValue) node.nodeValue = o;
    return;
  }
  if(node.nodeType!==1) return;
  // <option> text doubles as its value — pin the English value first so form logic is unaffected
  node.querySelectorAll('option').forEach(o => { if(!o.hasAttribute('value')) o.setAttribute('value', o.textContent); });
  if(node.nodeName==='OPTION' && !node.hasAttribute('value')) node.setAttribute('value', node.textContent);
  const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  const list = []; while(w.nextNode()) list.push(w.currentNode);
  list.forEach(trApply);
  const ph = el => { const v = el.getAttribute('placeholder'), o = trText(v); if(o!==v) el.setAttribute('placeholder', o); };
  if(node.hasAttribute && node.hasAttribute('placeholder')) ph(node);
  node.querySelectorAll('[placeholder]').forEach(ph);
  // pre-filled date inputs on the reschedule screen carry English month names
  node.querySelectorAll('#resch-in, #resch-out').forEach(i => { const o = trText(i.value); if(o!==i.value) i.value = o; });
  // calendar weekday header (Sunday-first): S M T W T F S -> P P S Ç P C C
  node.querySelectorAll('.cal-grid-head').forEach(h => {
    if(h.dataset.tr) return; h.dataset.tr = '1';
    ['P','P','S','Ç','P','C','C'].forEach((l,i)=>{ if(h.children[i]) h.children[i].textContent = l; });
  });
}
const trObserver = new MutationObserver(muts => {
  if(state.lang!=='tr') return;
  trObserver.disconnect();                       // our own edits must not re-trigger us
  muts.forEach(m => {
    if(m.type==='childList') m.addedNodes.forEach(trApply);
    else if(m.type==='characterData') trApply(m.target);
  });
  trObserver.observe(document.body, { childList:true, subtree:true, characterData:true });
});
trObserver.observe(document.body, { childList:true, subtree:true, characterData:true });
document.documentElement.lang = state.lang;
trApply(document.body);

render();

/* ============ SYNTHESIZED "WOOF" SOUND (no audio file — generated in-browser) ============ */
let barkPlayed = false;
function playBark(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    function woof(startOffset, duration){
      const bufferSize = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 1.6); }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 0.8;
      filter.frequency.setValueAtTime(1000, now+startOffset);
      filter.frequency.exponentialRampToValueAtTime(200, now+startOffset+duration);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now+startOffset);
      gain.gain.exponentialRampToValueAtTime(0.85, now+startOffset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+startOffset+duration);
      noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      noise.start(now+startOffset);
      noise.stop(now+startOffset+duration+0.02);
    }
    woof(0, 0.16);
    woof(0.20, 0.13);
    barkPlayed = true;
  }catch(e){ /* Web Audio unavailable — fail silently */ }
}

/* ============ LOADING SCREEN ============ */
const loaderEl = document.getElementById('loader');
function hideLoader(){
  if(!loaderEl) return;
  loaderEl.classList.add('hide');
  setTimeout(() => loaderEl.remove(), 550);
}
// Don't wait on window 'load' (fonts/images) — on a slow connection that event can be
// delayed a long time or never fire cleanly, which would leave the loader stuck.
// The app itself doesn't depend on those resources, so we just run on a plain timer.
playBark(); // will silently fail if the browser blocks autoplay audio before any user gesture
setTimeout(hideLoader, 1900);
// Absolute safety net: no matter what happens above, never let the loader stay up more than 5s
setTimeout(hideLoader, 5000);
// Fallback: if autoplay was blocked, play the bark on the visitor's first tap/click anywhere
document.addEventListener('click', function firstGestureBark(){
  if(!barkPlayed) playBark();
}, { once:true });
</script>
